# CineInfini - Centralized configuration (production)

paths:
  models_dir: "~/.cineinfini/models"
  reports_dir: "~/.cineinfini/reports"
  benchmark_dir: "~/.cineinfini/benchmark"
  test_videos_dir: "~/.cineinfini/test_videos"
  datasets_dir: "~/.cineinfini/datasets"
  cache_dir: "~/.cineinfini/cache"
  logs_dir: "~/.cineinfini/logs"
  temp_dir: "/tmp/cineinfini"
  output_root: "~/.cineinfini/output"

device:
  gpu_device: "auto"               # auto | cuda | cpu
  torch_dtype: "float16"           # float16 | float32
  use_amp: true

processing:
  max_duration_s: 60
  shot_threshold: 0.2
  min_shot_duration_s: 0.5
  downsample_to: [320, 180]
  n_frames_per_shot: 16
  frame_resize: [320, 180]
  step: 2
  adaptive_threshold: true
  threshold_percentile: 85
  num_workers: 4
  parallel_shots: true
  inter_shot_subsample: 5
  narrative_coherence: true
  compute_dtw_self: true
  compute_dtw_inter: true
  dtw_max_samples: 16
  benchmark_mode: true
  embedder: "arcface_onnx"
  semantic_scorer: "clip"
  hist_resize: [160, 90]
  hist_bins_hue: 20
  hist_bins_sat: 20

thresholds:
  motion: 25.0
  ssim3d: 0.45
  flicker: 0.10
  identity_drift: 0.60
  ssim_long_range: 0.45
  clip_temp: 0.25
  flicker_hf: 0.01
  narrative_coherence: 0.70
  temporal_coherence: 0.75
  physics_overall: 0.65
  aesthetic_score: 0.60
  causal_violation: 0.35
  trust_score: 0.70
  background_ssim: 0.55

# Model weights (downloaded once into paths.models_dir by `cineinfini bootstrap`)
model_urls:
